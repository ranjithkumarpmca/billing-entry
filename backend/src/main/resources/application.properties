server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/podregister
spring.datasource.username=pod
spring.datasource.password=pod

# Table is created by schema.sql on startup (safe to re-run).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
