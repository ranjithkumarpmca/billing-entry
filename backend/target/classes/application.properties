server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/podregister}
spring.datasource.username=${DB_USER:pod}
spring.datasource.password=${DB_PASS:pod}

# Table is created by schema.sql on startup (safe to re-run).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
